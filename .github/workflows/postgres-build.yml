name: "[PostgreSQL] Build with extensions (CentOS 7, glibc 2.17)"

on:
  workflow_dispatch:
    inputs:
      pg_version:
        description: 'PostgreSQL version'
        required: false
        default: '17.5'
      target_arch:
        description: 'Target architecture'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64
          - both

env:
  PG_VERSION: ${{ github.event.inputs.pg_version || '17.5' }}
  PG_MAJOR: '17'

jobs:
  # 根据 target_arch 输入展开 build 任务的矩阵
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.target_arch }}" in
            amd64) echo 'matrix={"arch":["amd64"]}'           >> "$GITHUB_OUTPUT" ;;
            arm64) echo 'matrix={"arch":["arm64"]}'           >> "$GITHUB_OUTPUT" ;;
            both)  echo 'matrix={"arch":["amd64","arm64"]}'   >> "$GITHUB_OUTPUT" ;;
            *)     echo "Unsupported target_arch: ${{ github.event.inputs.target_arch }}" >&2; exit 1 ;;
          esac

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # arm64 需要 QEMU 模拟（amd64 跳过，省时间）
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Resolve arch suffix
        id: arch
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "rpm_arch=x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "rpm_arch=aarch64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PostgreSQL and extensions in CentOS 7 container
        run: |
          # 通过 --platform 让 buildkit 在 QEMU/原生架构下分别构建
          docker build \
            --platform linux/${{ matrix.arch }} \
            --build-arg PG_VERSION=${PG_VERSION} \
            -t pg-build-centos7-${{ matrix.arch }} \
            postgres/

      - name: Extract build artifacts from container
        run: |
          set -euo pipefail
          ARCH="${{ steps.arch.outputs.rpm_arch }}"
          ARTIFACT="postgresql-${PG_VERSION}-glibc217-${ARCH}.tar.gz"

          docker create --platform linux/${{ matrix.arch }} \
            --name pg-output-${{ matrix.arch }} \
            pg-build-centos7-${{ matrix.arch }}
          docker cp pg-output-${{ matrix.arch }}:/build-output/${ARTIFACT}     /tmp/
          docker cp pg-output-${{ matrix.arch }}:/build-output/EXTENSIONS.txt  /tmp/EXTENSIONS-${ARCH}.txt
          docker rm pg-output-${{ matrix.arch }}

          ls -lh /tmp/${ARTIFACT}
          echo ""
          echo "=== 扩展清单 (${ARCH}) ==="
          cat /tmp/EXTENSIONS-${ARCH}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: postgresql-${{ env.PG_VERSION }}-glibc217-${{ steps.arch.outputs.rpm_arch }}
          path: |
            /tmp/postgresql-${{ env.PG_VERSION }}-glibc217-${{ steps.arch.outputs.rpm_arch }}.tar.gz
            /tmp/EXTENSIONS-${{ steps.arch.outputs.rpm_arch }}.txt
          retention-days: 90

name: Build PostgreSQL with Extensions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pg_version:
        description: 'PostgreSQL version'
        required: false
        default: '17.5'

env:
  PG_VERSION: ${{ github.event.inputs.pg_version || '17.5' }}
  PG_MAJOR: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PostgreSQL and extensions in CentOS 7 container
        run: |
          # 使用 Docker 在 CentOS 7 环境中编译，产物挂载到宿主机
          docker build --build-arg PG_VERSION=${PG_VERSION} \
            -t pg-build-centos7 \
            -f Dockerfile.centos7 .

      - name: Extract build artifacts from container
        run: |
          # 从容器中拷贝编译产物
          docker create --name pg-output pg-build-centos7
          docker cp pg-output:/build-output/postgresql-${PG_VERSION}-glibc217-x86_64.tar.gz /tmp/
          docker cp pg-output:/build-output/EXTENSIONS.txt /tmp/
          docker rm pg-output

          ls -lh /tmp/postgresql-${PG_VERSION}-glibc217-x86_64.tar.gz
          echo ""
          echo "=== 扩展清单 ==="
          cat /tmp/EXTENSIONS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-${{ env.PG_VERSION }}-glibc217-x86_64
          path: /tmp/postgresql-${{ env.PG_VERSION }}-glibc217-x86_64.tar.gz
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/postgresql-${{ env.PG_VERSION }}-glibc217-x86_64.tar.gz
          body: |
            PostgreSQL ${{ env.PG_VERSION }} (CentOS 7 构建, glibc 2.17 兼容)

            兼容: CentOS 7+, Ubuntu 18.04+, Debian 10+, Amazon Linux 2, RHEL 7+, SLES 12+ 等几乎所有 Linux 发行版

            包含扩展: pg_cron, pg_duckdb, pgvector, postgres_fdw, pg_stat_statements, pg_trgm, hstore, btree_gin, btree_gist 等

            使用方式:
            ```bash
            tar -xzf postgresql-${{ env.PG_VERSION }}-glibc217-x86_64.tar.gz -C / --strip-components=1
            /usr/local/bin/initdb -D /var/lib/pgsql/data
            /usr/local/bin/pg_ctl -D /var/lib/pgsql/data start
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
